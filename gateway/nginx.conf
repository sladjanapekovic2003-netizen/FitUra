server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    location ~ ^/(paketi|clanarina|clanarine)(/|$) {
        set $target clanarine:8000;
        proxy_pass http://$target$request_uri;
    }
    location ~ ^/(obvestila|nastavitve|uporabniki/[^/]+/povzetek)(/|$) {
        set $target obvestila:8000;
        proxy_pass http://$target$request_uri;
    }
    location ~ ^/(ocene|odgovori)(/|$) {
        set $target ocene:8000;
        proxy_pass http://$target$request_uri;
    }
    location ~ ^/(uporabniki|uporabnik|registracija|prijava)(/|$) {
        set $target uporabniki:3001;
        proxy_pass http://$target$request_uri;
    }
    location ~ ^/termini(/|$) {
        set $target termini:3002;
        proxy_pass http://$target$request_uri;
    }
    location ~ ^/rezervacije(/|$) {
        set $target rezervacije:3003;
        proxy_pass http://$target$request_uri;
    }
}
