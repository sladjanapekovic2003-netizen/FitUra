services:
  uporabniki-db:
    image: postgres:16-alpine
    container_name: uporabniki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uporabniki_db
    volumes:
      - ./uporabniki/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  uporabniki:
    build: ./uporabniki
    container_name: uporabniki
    restart: unless-stopped
    depends_on:
      uporabniki-db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: uporabniki-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: uporabniki_db
    ports:
      - "3001:3001"

  termini-db:
    image: postgres:16-alpine
    container_name: termini-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: termini_db
    volumes:
      - ./termini/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  termini:
    build: ./termini
    container_name: termini
    restart: unless-stopped
    depends_on:
      termini-db:
        condition: service_healthy
    environment:
      DB_HOST: termini-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: termini_db
    ports:
      - "3002:3002"

  rezervacije-db:
    image: postgres:16-alpine
    container_name: rezervacije-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rezervacije_db
    volumes:
      - ./rezervacije/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rezervacije:
    build: ./rezervacije
    container_name: rezervacije
    restart: unless-stopped
    depends_on:
      rezervacije-db:
        condition: service_healthy
      termini:
        condition: service_started
    environment:
      DB_HOST: rezervacije-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: rezervacije_db
      TERMINI_URL: http://termini:3002
      OBVESTILA_URL: http://localhost:8002
    ports:
      - "3003:3003"