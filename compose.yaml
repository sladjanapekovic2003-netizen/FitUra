services:
  clanarine:
    build: ./storitve/clanarine
    ports: ["127.0.0.1:8001:8000"]
    environment:
      DATABASE_URL: postgresql://fitura:${POSTGRES_PASSWORD:-fitura-local}@clanarine-db:5432/clanarine
      GATEWAY_URL: http://gateway:8080
    depends_on:
      clanarine-db: {condition: service_healthy}
  obvestila:
    build: ./storitve/obvestila
    ports: ["127.0.0.1:8002:8000"]
    environment:
      DATABASE_URL: postgresql://fitura:${POSTGRES_PASSWORD:-fitura-local}@obvestila-db:5432/obvestila
      GATEWAY_URL: http://gateway:8080
    depends_on:
      obvestila-db: {condition: service_healthy}
  ocene:
    build: ./storitve/ocene
    ports: ["127.0.0.1:8003:8000"]
    environment:
      DATABASE_URL: postgresql://fitura:${POSTGRES_PASSWORD:-fitura-local}@ocene-db:5432/ocene
      GATEWAY_URL: http://gateway:8080
    depends_on:
      ocene-db: {condition: service_healthy}
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  clanarine-db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: fitura, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fitura-local}", POSTGRES_DB: clanarine}
    volumes: [clanarine-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitura -d clanarine"]
      interval: 3s
      timeout: 3s
      retries: 20
  obvestila-db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: fitura, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fitura-local}", POSTGRES_DB: obvestila}
    volumes: [obvestila-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitura -d obvestila"]
      interval: 3s
      timeout: 3s
      retries: 20
  ocene-db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: fitura, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fitura-local}", POSTGRES_DB: ocene}
    volumes: [ocene-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitura -d ocene"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  clanarine-pg:
  obvestila-pg:
  ocene-pg:
